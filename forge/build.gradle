plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "${project.mod_id}.mixins.json"
        mixinConfig "${project.mod_id}.forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "${project.mod_id}.forge.refmap.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${project.mc_version}-${project.forge_version}"

    modApi "dev.architectury:architectury-forge:${project.architectury_version}"

    modImplementation "software.bernie.geckolib:geckolib-forge-${project.mc_version}:${project.geckolib_version}"
    // GeckoLib pulls in mclib but Forge's dev classloader does not expose
    // transitive Maven deps to runtime — bundle it explicitly.
    forgeRuntimeLibrary "com.eliotlash.mclib:mclib:20"
    implementation "com.eliotlash.mclib:mclib:20"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
